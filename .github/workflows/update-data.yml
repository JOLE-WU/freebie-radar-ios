name: 更新真实福利数据

# 每小时抓取 freebie-radar 演示站的公开真福利数据，生成 docs/data.json
# 公开仓库的 GitHub Actions 分钟数免费，不消耗用户额度。
on:
  schedule:
    - cron: '3 * * * *'   # 每小时第 3 分钟
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取真实数据
        run: node scripts/fetch-data.mjs

      - name: 提交数据（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新真实福利数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "数据已更新并推送"
          fi
